<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Let Go</title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<header class="header">

    <div class="logo">
        Let Go
    </div>

    <nav>
        <a href="#">Home</a>
        <a href="#">Browse</a>
        <a href="#">Login</a>
        <a href="#">Register</a>
    </nav>

</header>


<main>

    <section class="hero">

        <h1>Give Things a New Life</h1>

        <p>
            Buy, sell and give away items in your local community.
        </p>

        <div class="search-container">

            <input
                    id="searchInput"
                    type="text"
                    placeholder="Search for items..."
            >

            <button id="searchButton">
                Search
            </button>

        </div>

    </section>


    <section class="categories">

        <h2>Categories</h2>

        <div class="category-container">

            <button class="category">
                Furniture
            </button>

            <button class="category">
                Electronics
            </button>

            <button class="category">
                Clothing
            </button>

            <button class="category">
                Books
            </button>

            <button class="category">
                Home
            </button>

            <button class="category">
                Other
            </button>

        </div>

    </section>


    <section class="listings">

        <h2>Recent Listings</h2>

        <div class="listing-container">

            <div class="product-card">

                <div class="product-image">
                    🪑
                </div>

                <h3>Office Chair</h3>

                <p>$20</p>

                <button class="view-button">
                    View Item
                </button>

            </div>


            <div class="product-card">

                <div class="product-image">
                    📱
                </div>

                <h3>Mobile Phone</h3>

                <p>$100</p>

                <button class="view-button">
                    View Item
                </button>

            </div>


            <div class="product-card">

                <div class="product-image">
                    📚
                </div>

                <h3>Books</h3>

                <p>$10</p>

                <button class="view-button">
                    View Item
                </button>

            </div>

        </div>

    </section>

</main>


<footer>

    <p>© 2026 Let Go</p>

</footer>


<script src="assets/js/script.js"></script>

</body>

</html>
